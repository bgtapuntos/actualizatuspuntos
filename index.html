<script>
const tipoPersonaSelect = document.getElementById("tipoPersona");

// Guardar texto completo una sola vez
[...tipoPersonaSelect.options].forEach(opt => {
    opt.dataset.full = opt.text;
});

// Medir ancho real del texto
function textWidth(text, font) {
    const canvas = textWidth.canvas || (textWidth.canvas = document.createElement("canvas"));
    const ctx = canvas.getContext("2d");
    ctx.font = font;
    return ctx.measureText(text).width;
}

// Abreviar automáticamente si no cabe
function fitTextToSelect() {
    const opt = tipoPersonaSelect.options[tipoPersonaSelect.selectedIndex];
    if (!opt) return;

    const fullText = opt.dataset.full;
    opt.text = fullText;

    const style = getComputedStyle(tipoPersonaSelect);
    const font = `${style.fontSize} ${style.fontFamily}`;

    // Ancho disponible (padding + espacio flecha)
    const availableWidth =
        tipoPersonaSelect.clientWidth -
        parseFloat(style.paddingLeft) -
        parseFloat(style.paddingRight) -
        30; // espacio para flecha

    if (textWidth(fullText, font) <= availableWidth) return;

    let shortened = fullText;
    while (shortened.length > 1) {
        shortened = shortened.slice(0, -1);
        if (textWidth(shortened + "…", font) <= availableWidth) {
            opt.text = shortened + "…";
            return;
        }
    }
}

// Restaurar texto completo al abrir
function restoreFullText() {
    [...tipoPersonaSelect.options].forEach(opt => {
        opt.text = opt.dataset.full;
    });
}

// Eventos
tipoPersonaSelect.addEventListener("focus", restoreFullText);
tipoPersonaSelect.addEventListener("change", fitTextToSelect);
tipoPersonaSelect.addEventListener("blur", fitTextToSelect);

// Ajustar al cargar y al redimensionar
window.addEventListener("load", fitTextToSelect);
window.addEventListener("resize", fitTextToSelect);
</script>
